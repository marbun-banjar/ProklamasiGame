<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proklamasi Clash v4</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div id="flashRed"></div>
  <div id="ui">
    <div class="hp-wrap p1"><div class="tag">SOEKARNO-HATTA</div><div class="bar-out"><div class="bar-in" id="hp1"></div><div class="hp-num" id="hp1n">100</div></div></div>
    <div class="hp-wrap p2"><div class="tag">TENTARA BELANDA</div><div class="bar-out"><div class="bar-in" id="hp2"></div><div class="hp-num" id="hp2n">100</div></div></div>
    <div id="turn" class="pulse">GILIRAN: SOEKARNO-HATTA</div>
    <div id="timer">15</div>
    <button id="muteBtn">SFX: ON</button>
    <div id="qPanel"><div id="qText"></div><div id="aGrid"></div></div>
    <div id="start">
      <h1>PROKLAMASI<br>CLASH</h1>
      <div class="sub">FIELD OF MEMORIES EDITION</div>
      <div class="vs-row">
        <div class="fgt"><span class="em">&#127470;&#127465;</span>SOEKARNO-HATTA<br><span class="hpnum">100 HP</span></div>
        <div class="vs-txt">VS</div>
        <div class="fgt"><span class="em">&#127475;&#127473;</span>TENTARA BELANDA<br><span class="hpnum">100 HP</span></div>
      </div>
      <button class="big-btn" id="startBtn">MULAI PERTARUNGAN</button>
      <div class="sub" style="opacity:.55;font-size:10px">Jawab benar = serang! Salah = lawan counter 50/50!</div>
    </div>
    <div id="over"><h2>PEMENANG</h2><div id="winName"></div><div id="winSub"></div><button class="y-btn" id="againBtn">MAIN LAGI</button></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
