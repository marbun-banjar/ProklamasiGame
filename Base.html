const QUESTIONS=[

{q:"Makna alinea pertama Pembukaan UUD 1945 adalah...",ok:"Kemerdekaan adalah hak segala bangsa",no:["Tujuan negara Indonesia","Bentuk negara Indonesia","Dasar negara Indonesia"]},
{q:"Lembaga negara yang menguji undang-undang terhadap UUD adalah...",ok:"Mahkamah Konstitusi",no:["Mahkamah Agung","DPR","MPR"]},

/* ============ CANVAS ============ */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=1280,H=720,GROUND_Y=Math.floor(H*0.56);

function makePixel(pixels,scale){
  const w=pixels[0].length*scale,h=pixels.length*scale;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const cx=c.getContext('2d');cx.imageSmoothingEnabled=false;
  for(let y=0;y<pixels.length;y++)for(let x=0;x<pixels[y].length;x++){
    const col=PAL[pixels[y][x]];
    if(col){cx.fillStyle=col;cx.fillRect(x*scale,y*scale,scale,scale);}
  }
  return c;
}
function flipCanvas(src){
  const c=document.createElement('canvas');c.width=src.width;c.height=src.height;
  const cx=c.getContext('2d');cx.imageSmoothingEnabled=false;
  cx.translate(src.width,0);cx.scale(-1,1);cx.drawImage(src,0,0);return c;
}
const SCL=8;
const SOEK_IMG=makePixel(PIX_SOEK,SCL),DUTCH_IMG=flipCanvas(makePixel(PIX_DUTCH,SCL));
const SOEK_W=SOEK_IMG.width,SOEK_H=SOEK_IMG.height,DUTCH_W=DUTCH_IMG.width,DUTCH_H=DUTCH_IMG.height;
const SOEK_X=140,DUTCH_X=W-140-DUTCH_W,SOEK_Y=GROUND_Y-SOEK_H,DUTCH_Y=GROUND_Y-DUTCH_H;

/* ============ AUDIO ENGINE (Military Choir March) ============ */
let AC=null,musicOn=false,sfxOn=true,musicTimeout=null,masterGain=null,musicGain=null;
let beatTime=0,beatCount=0;

function initAudio(){
  if(AC)return;
  try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  masterGain=AC.createGain();masterGain.gain.value=0.9;masterGain.connect(AC.destination);
  musicGain=AC.createGain();musicGain.gain.value=0.55;musicGain.connect(masterGain);
}
function tone(freq,dur,start,type,vol,dest){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.value=freq;
  g.gain.setValueAtTime(0,start);
  g.gain.linearRampToValueAtTime(vol,start+0.02);
  g.gain.setValueAtTime(vol,start+dur*0.6);
  g.gain.exponentialRampToValueAtTime(0.001,start+dur);
  o.connect(g);g.connect(dest||musicGain);
  o.start(start);o.stop(start+dur+0.05);
}
function noiseBurst(start,dur,vol){
  if(!AC)return;
  const buf=AC.createBuffer(1,Math.floor(AC.sampleRate*dur),AC.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=AC.createBufferSource();s.buffer=buf;
  const g=AC.createGain();g.gain.value=vol;
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;f.Q.value=0.7;
  s.connect(f);f.connect(g);g.connect(musicGain);
  s.start(start);
}
function shoutAAA(start){
  if(!AC)return;
  const voices=[130,195,260,390];
  voices.forEach((f,i)=>{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=i%2?'sawtooth':'square';
    o.frequency.setValueAtTime(f,start);
    o.frequency.linearRampToValueAtTime(f*0.94,start+0.5);
    const vib=AC.createOscillator(),vg=AC.createGain();
    vib.frequency.value=5.5;vg.gain.value=3;
    vib.connect(vg);vg.connect(o.frequency);
    g.gain.setValueAtTime(0,start);
    g.gain.linearRampToValueAtTime(0.09-i*0.015,start+0.08);
    g.gain.setValueAtTime(0.09-i*0.015,start+0.4);
    g.gain.exponentialRampToValueAtTime(0.001,start+0.85);
    o.connect(g);g.connect(musicGain);
    o.start(start);o.stop(start+0.9);
    vib.start(start);vib.stop(start+0.9);

/* March in A minor — 8 bars loop, 4/4 */
const BEAT=0.48;
const CHORDS=[ // per bar: bass root, harmony third, lead
  {bass:110.00,third:174.61,lead:220.00}, // Am
  {bass:110.00,third:174.61,lead:261.63},
  {bass:87.31, third:174.61,lead:220.00}, // F
  {bass:87.31, third:220.00,lead:261.63},
  {bass:98.00, third:196.00,lead:246.94}, // G
  {bass:98.00, third:196.00,lead:293.66},
  {bass:110.00,third:174.61,lead:220.00}, // Am
  {bass:110.00,third:174.61,lead:329.63}
];

function scheduleMusic(){
  if(!musicOn||!AC)return;
  const now=AC.currentTime;
  while(beatTime<now+0.6){
    const bar=Math.floor(beatCount/4)%CHORDS.length;
    const beatInBar=beatCount%4;
    const ch=CHORDS[bar];
    // Bass: quarter notes
    tone(ch.bass,BEAT*0.9,beatTime,'triangle',0.15);
    // Bass octave
    tone(ch.bass*2,BEAT*0.9,beatTime,'sine',0.08);
    // Harmony: half notes on beats 0,2
    if(beatInBar===0||beatInBar===2){
      tone(ch.third,BEAT*1.9,beatTime,'square',0.05);
      tone(ch.third*1.005,BEAT*1.9,beatTime,'sawtooth',0.03);
    }
    // Lead melody: varies per beat
    const leadPattern=[1,0.75,0.75,1][beatInBar];
    if(beatInBar===0||beatInBar===2){
      tone(ch.lead,BEAT*1.7,beatTime,'square',0.06);
    } else if(beatInBar===1||beatInBar===3){
      tone(ch.lead*1.5,BEAT*0.85,beatTime,'square',0.045);
    }
    // Snare on 2 & 4
    if(beatInBar===1||beatInBar===3)noiseBurst(beatTime,0.12,0.12);
    // Kick on 1 & 3
    if(beatInBar===0||beatInBar===2){
      const o=AC.createOscillator(),g=AC.createGain();
      o.frequency.setValueAtTime(80,beatTime);
      o.frequency.exponentialRampToValueAtTime(35,beatTime+0.12);
      g.gain.setValueAtTime(0.18,beatTime);
      g.gain.exponentialRampToValueAtTime(0.001,beatTime+0.15);
      o.connect(g);g.connect(musicGain);
      o.start(beatTime);o.stop(beatTime+0.16);
    }
    // Shout AAA every 4 bars (at end of bar 4 & 8)
    if((beatCount%32)===28)shoutAAA(beatTime);
    // Whistle on beat before shout
    if((beatCount%32)===26)whistle(beatTime);
    beatTime+=BEAT;
    beatCount++;
  }
  musicTimeout=setTimeout(scheduleMusic,120);
}
function startMusic(){
  if(!AC||musicOn)return;
  musicOn=true;beatTime=AC.currentTime+0.1;beatCount=0;scheduleMusic();
}
function stopMusic(){musicOn=false;if(musicTimeout)clearTimeout(musicTimeout);}

let bgSeed=987654;
function rng(){bgSeed=(bgSeed*9301+49297)%233280;return bgSeed/233280;}
let bgCache=null;
let buildingsMeta=[]; // {x,y,w,h,depth,front}

function px(c,x,y,w,h,color){c.fillStyle=color;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}

function drawPixelBuilding(c,x,baseY,w,h,depth,lightness,windows){
  // Colors based on lightness (0=dark far, 1=bright near)
  const colTop = lightness>0.7?'#B5A48A':lightness>0.4?'#8E7F68':'#5C5243';
  const colFront=lightness>0.7?'#9B8A72':lightness>0.4?'#7A6D5C':'#4A4238';
  const colFrontDark=lightness>0.7?'#6E5F4A':lightness>0.4?'#524537':'#332D24';
  const colSide=lightness>0.7?'#4E4234':lightness>0.4?'#3E3428':'#28221A';
  const outline='rgba(0,0,0,.85)';

  const topY=baseY-h;
  // Right side extrusion
  c.fillStyle=colSide;
  c.beginPath();
  c.moveTo(x+w,topY);
  c.lineTo(x+w+depth,topY-depth*0.7);
  c.lineTo(x+w+depth,baseY-depth*0.7);
  c.lineTo(x+w,baseY);
  c.closePath();c.fill();
  c.strokeStyle=outline;c.lineWidth=2;c.stroke();

  // Top face
  c.fillStyle=colTop;
  c.beginPath();
  c.moveTo(x,topY);
  c.lineTo(x+w,topY);
  c.lineTo(x+w+depth,topY-depth*0.7);
  c.lineTo(x+depth,topY-depth*0.7);
  c.closePath();c.fill();
  c.strokeStyle=outline;c.stroke();

  // Front face with pixelated jagged top
  c.fillStyle=colFront;
  const segs=Math.max(4,Math.floor(w/14));
  const topProfile=[];
  for(let i=0;i<=segs;i++){
    const isEdge = i===0||i===segs;
    topProfile.push(isEdge ? 0 : -Math.floor(rng()*16));
  }
  c.beginPath();
  c.moveTo(x,baseY);
  for(let i=0;i<=segs;i++){
    const pxx=x+(i/segs)*w;
    const pyy=topY+topProfile[i];
    c.lineTo(pxx,pyy);
  }
  c.lineTo(x+w,baseY);
  c.closePath();c.fill();
  c.strokeStyle=outline;c.stroke();

  // Windows (8-bit style grid)
  if(windows){
    const winCol=lightness>0.5?'rgba(255,220,120,.35)':'rgba(255,180,80,.18)';
    const winDark='rgba(0,0,0,.7)';
    const stepX=Math.max(18,Math.floor(w/4));
    const stepY=26;
    for(let wy=topY+30; wy<baseY-20; wy+=stepY){
      for(let wx=x+10; wx<x+w-16; wx+=stepX){
        if(rng()>0.25){
          px(c,wx,wy,10,14,winDark);
          px(c,wx+2,wy+2,4,4,winCol);
        }
      }
    }
  }

  // Cracks (pixel lines)
  const cracks=Math.floor(rng()*4)+2;
  c.strokeStyle='rgba(0,0,0,.55)';c.lineWidth=2;
  for(let i=0;i<cracks;i++){
    const cx=x+rng()*w;
    const cy=topY+rng()*h*0.4;
    c.beginPath();c.moveTo(Math.round(cx),Math.round(cy));
    c.lineTo(Math.round(cx+(rng()-0.5)*20),Math.round(cy+h*0.3));
    c.stroke();
  }
}

  c.fillStyle='rgba(0,0,0,.5)';
  for(let i=0;i<200;i++){
    const rx=rng()*W, ry=rTop+20+rng()*(rBot-rTop-20);

    c.fillRect(Math.round(rx),Math.round(ry),Math.round(sw),Math.round(sh));

  for(let i=0;i<60;i++){
    const rx=rng()*W, ry=rTop+40+rng()*(rBot-rTop-40);

  }
  // Yellow center line (perspective dashes)
  c.fillStyle='rgba(220,190,60,.55)';
  for(let i=0;i<24;i++){
    const dy=rTop+30+i*((rBot-rTop-30)/24);
    const dw=6+i*0.8;
    c.fillRect((W/2)-dw/2, Math.round(dy), Math.round(dw), 3);
  }
  // Potholes
  c.fillStyle='rgba(0,0,0,.6)';
  for(let i=0;i<8;i++){
    const hx=rng()*W, hy=rTop+50+rng()*(rBot-rTop-80);
    c.beginPath();c.ellipse(hx,hy,10+rng()*14,4+rng()*4,0,0,Math.PI*2);c.fill();
  }

  // NEAR LAYER: large foreground buildings (partial, sides only) — big & bright
  drawPixelBuilding(c,-30,GROUND_Y+20,140,GROUND_Y+180,18,0.85,true);
  drawPixelBuilding(c,W-110,GROUND_Y+20,150,GROUND_Y+200,20,0.85,true);

  // Horizon line
  c.fillStyle='rgba(0,0,0,.6)';c.fillRect(0,GROUND_Y-2,W,3);
}

function updatePlanes(dt){
  const dtSec=dt/1000;
  for(let i=planes.length-1;i>=0;i--){
    const p=planes[i];
    if(!p.alive){
      // Falling
      p.vy+=0.35;
      p.x+=p.vx;
      p.y+=p.vy;
      p.roll=(p.roll||0)+0.08;
      if(p.y>GROUND_Y+20){
        // ground explosion
        spawnMushroom(p.x,GROUND_Y,false);
        planes.splice(i,1);
      }
      continue;
    }
    p.prop+=0.3;
    // Hit state
    if(p.hitTimer>0){
      p.hitTimer-=dtSec;
      if(p.hitTimer<=0){
        p.alive=false;
        p.vy=1;
        p.vx=p.dir*1.5;
      }
      continue;
    }
    // Movement
    if(p.type==='chase' && p.target && p.target.alive){
      const dx=p.target.x-p.x, dy=p.target.y-p.y;
      const dist=Math.hypot(dx,dy);
      // steer toward target
      const desiredVx=(dx/dist)*2.4;
      const desiredVy=(dy/dist)*2.4;
      p.vx+=(desiredVx-p.vx)*0.05;
      p.vy+=(desiredVy-p.vy)*0.05;
      p.timer+=dt;
      // shoot every ~1.2s if aligned
      if(p.timer>1100 && Math.abs(dy)<40){
        p.timer=0;
        spawnAirBullet({x:p.x,y:p.y},{x:p.target.x,y:p.target.y});
      }
    } else {
      // patrol — free movement with gentle wobble
      p.vy=Math.sin(performance.now()/900 + p.x*0.01)*0.4;
      if(p.timer>2400){p.timer=0;}
      p.timer+=dt;
    }
    p.x+=p.vx;
    p.y+=p.vy;
    // keep in bounds
    if(p.y<40)p.vy=Math.abs(p.vy);
    if(p.y>GROUND_Y-80)p.vy=-Math.abs(p.vy);
    // Remove offscreen
    if(p.x<-200||p.x>W+200)planes.splice(i,1);
  }

  // Bullets
  for(let i=airBullets.length-1;i>=0;i--){
    const b=airBullets[i];
    b.x+=b.vx;b.y+=b.vy;
    b.life-=dtSec;
    if(b.life<=0||b.x<-50||b.x>W+50||b.y<-50||b.y>H+50){airBullets.splice(i,1);continue;}
    // Collision with planes
    for(const p of planes){
      if(!p.alive||p.hitTimer>0)continue;
      if(Math.abs(b.x-p.x)<22 && Math.abs(b.y-p.y)<10){
        p.hitTimer=1.2;
        airBullets.splice(i,1);
        break;
      }
    }
  }

  // Explosions (mushroom)
  for(let i=explosions.length-1;i>=0;i--){
    const e=explosions[i];
    e.t+=dtSec;
    if(e.t>e.dur)explosions.splice(i,1);
  }
}

function drawMushroom(e){
  const t=e.t/e.dur; // 0..1
  const rise=Math.min(1, t*2.2); // grow fast
  const fade=t<0.15?t/0.15:(t>0.7?1-(t-0.7)/0.3:1);
  // Opacity by position: farther = more transparent
  const dist=1 - (e.y / H); // 0 far top, 1 near bottom
  const baseOp=(e.behind?0.45:0.85) * (0.5 + dist*0.5);
  const op=baseOp*fade;
  const size=(60+180*rise) * (e.behind?0.7:1);

  ctx.save();
  ctx.globalAlpha=op;
  ctx.translate(e.x, e.baseY);

  // Ground shock ring
  ctx.strokeStyle='rgba(255,200,120,.7)';
  ctx.lineWidth=3;
  ctx.beginPath();ctx.ellipse(0,0,size*1.4,size*0.25,0,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='rgba(255,120,40,.4)';
  ctx.beginPath();ctx.ellipse(0,0,size*1.9,size*0.32,0,0,Math.PI*2);ctx.stroke();

  // Ground glow
  const gg=ctx.createRadialGradient(0,0,5,0,0,size*1.6);
  gg.addColorStop(0,'rgba(255,220,140,.85)');
  gg.addColorStop(0.4,'rgba(255,140,60,.5)');
  gg.addColorStop(1,'rgba(180,40,20,0)');
  ctx.fillStyle=gg;
  ctx.beginPath();ctx.ellipse(0,0,size*1.6,size*0.4,0,0,Math.PI*2);ctx.fill();

  // Mushroom STEM (column)
  const stemW=size*0.55;
  const stemH=size*2.2*rise;
  const stemGrad=ctx.createLinearGradient(0,-stemH,0,0);
  stemGrad.addColorStop(0,'rgba(255,240,180,.9)');
  stemGrad.addColorStop(0.5,'rgba(255,180,80,.85)');
  stemGrad.addColorStop(1,'rgba(220,80,30,.7)');
  ctx.fillStyle=stemGrad;
  ctx.beginPath();
  ctx.moveTo(-stemW/2,0);
  ctx.lineTo(-stemW/2*0.7,-stemH);
  ctx.lineTo(stemW/2*0.7,-stemH);
  ctx.lineTo(stemW/2,0);
  ctx.closePath();ctx.fill();

  // Mushroom CAP (dome)
  const capY=-stemH;
  const capW=size*2.6*rise;
  const capH=size*1.5*rise;
  // outer cap (dark red/brown cloud)
  const capGrad=ctx.createRadialGradient(0,capY,5,0,capY,capW);
  capGrad.addColorStop(0,'rgba(255,240,180,.95)');
  capGrad.addColorStop(0.35,'rgba(255,160,60,.9)');
  capGrad.addColorStop(0.7,'rgba(200,70,30,.75)');
  capGrad.addColorStop(1,'rgba(80,30,20,0)');
  ctx.fillStyle=capGrad;
  ctx.beginPath();
  ctx.ellipse(0,capY,capW/2,capH/2,0,0,Math.PI*2);
  ctx.fill();

  // Dark smoke puffs on top
  ctx.fillStyle='rgba(60,40,30,.55)';
  for(let i=0;i<5;i++){
    const px=Math.cos(i*1.3)*capW*0.28;
    const py=capY-capH*0.35-Math.abs(Math.sin(i*0.7))*capH*0.4;
    ctx.beginPath();
    ctx.arc(px,py,capH*0.35,0,Math.PI*2);
    ctx.fill();
  }

  // Bright core
  ctx.fillStyle='rgba(255,255,220,.9)';
  ctx.beginPath();
  ctx.ellipse(0,capY,capW*0.15,capH*0.3,0,0,Math.PI*2);
  ctx.fill();

  // Rising ring
  if(t>0.15){
    const ringR=size*(0.8+t*2.2);
    ctx.strokeStyle=`rgba(255,200,120,${(1-t)*0.6})`;
    ctx.lineWidth=4;
    ctx.beginPath();ctx.ellipse(0,capY-capH*0.6,ringR,ringR*0.25,0,0,Math.PI*2);ctx.stroke();
  }

  ctx.restore();
}

/* ============ GAME STATE ============ */
const state={hp:[100,100],turn:0,queue:[],qIdx:0,currentQ:null,busy:false,active:false,timeLeft:15,timerInterval:null};
const anim={
  soek:{lunge:0,lungeC:0,flash:0,flashC:0,bob:Math.random()*Math.PI*2},
  dutch:{lunge:0,lungeC:0,flash:0,flashC:0,bob:Math.random()*Math.PI*2}
};
let shakeAmount=0,shakeTime=0;

const el={hp1:document.getElementById('hp1'),hp2:document.getElementById('hp2'),hp1n:document.getElementById('hp1n'),hp2n:document.getElementById('hp2n'),turn:document.getElementById('turn'),timer:document.getElementById('timer'),qPanel:document.getElementById('qPanel'),qText:document.getElementById('qText'),aGrid:document.getElementById('aGrid'),start:document.getElementById('start'),over:document.getElementById('over'),winName:document.getElementById('winName'),winSub:document.getElementById('winSub'),flashRed:document.getElementById('flashRed'),muteBtn:document.getElementById('muteBtn')};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function updateHP(){
  const p1=Math.max(0,state.hp[0]),p2=Math.max(0,state.hp[1]);
  el.hp1.style.width=p1+'%';el.hp2.style.width=p2+'%';
  el.hp1n.textContent=p1;el.hp2n.textContent=p2;
  el.hp1.classList.toggle('low',p1<=30);el.hp2.classList.toggle('low',p2<=30);
}
function feedback(text,color){
  const d=document.createElement('div');d.className='fb';d.textContent=text;d.style.color=color;
  document.getElementById('ui').appendChild(d);setTimeout(()=>d.remove(),1400);
}
function floatDmg(target,text){
  const d=document.createElement('div');d.className='dmg';d.textContent=text;
  const rect=cv.getBoundingClientRect(),sx=rect.width/W,sy=rect.height/H;
  const cx=target===0?SOEK_X+SOEK_W/2:DUTCH_X+DUTCH_W/2;
  const cy=(target===0?SOEK_Y:DUTCH_Y)-30;
  d.style.left=(cx*sx)+'px';d.style.top=(cy*sy)+'px';
  document.getElementById('ui').appendChild(d);setTimeout(()=>d.remove(),1250);
}
function doShake(a,d){shakeAmount=Math.max(shakeAmount,a);shakeTime=Math.max(shakeTime,d);}
function redFlash(){
  el.flashRed.style.transition='opacity .05s';el.flashRed.style.opacity='0.7';
  setTimeout(()=>{el.flashRed.style.transition='opacity .5s';el.flashRed.style.opacity='0';},80);
}

function startGame(){
  initAudio();
  if(AC&&AC.state==='suspended')AC.resume();
  startMusic();
  state.hp=[100,100];state.turn=0;state.busy=false;state.active=true;
  state.qIdx=0;state.queue=shuffle([...QUESTIONS]);
  updateHP();
  el.start.style.display='none';el.over.classList.remove('on');
  startTurn();
}
function startTurn(){
  if(!state.active)return;
  if(state.hp[0]<=0||state.hp[1]<=0){endGame();return;}
  const names=['SOEKARNO-HATTA','TENTARA BELANDA'],colors=['#FFD93D','#87CEEB'];
  el.turn.textContent='GILIRAN: '+names[state.turn];
  el.turn.style.color=colors[state.turn];el.turn.style.borderColor=colors[state.turn];
  if(state.qIdx>=state.queue.length){state.queue=shuffle([...QUESTIONS]);state.qIdx=0;}
  const q=state.queue[state.qIdx++];state.currentQ=q;
  const opts=shuffle([q.ok,...q.no]);
  el.qText.textContent='> '+q.q;el.aGrid.innerHTML='';
  opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='abtn';b.textContent=String.fromCharCode(65+i)+'. '+o;
    b.dataset.v=o;b.onclick=()=>handleAnswer(o,b);el.aGrid.appendChild(b);
  });
  el.qPanel.classList.add('on');state.busy=false;
  state.timeLeft=15;el.timer.textContent=state.timeLeft;
  el.timer.classList.add('active');el.timer.classList.remove('warn');
  if(state.timerInterval)clearInterval(state.timerInterval);
  state.timerInterval=setInterval(()=>{
    if(!state.active){clearInterval(state.timerInterval);return;}
    state.timeLeft--;el.timer.textContent=state.timeLeft;
    if(state.timeLeft<=5)el.timer.classList.add('warn');
    if(state.timeLeft<=0){clearInterval(state.timerInterval);if(!state.busy){state.busy=true;timeoutAnswer();}}
  },1000);
}
function timeoutAnswer(){
  SFX.wrong();redFlash();doShake(14,400);
  el.qPanel.classList.add('shake');setTimeout(()=>el.qPanel.classList.remove('shake'),550);
  document.querySelectorAll('.abtn').forEach(b=>{b.disabled=true;if(b.dataset.v===state.currentQ.ok)b.classList.add('ok');});
  feedback('WAKTU HABIS!','#f87171');
  setTimeout(()=>rollCounterAttack(),1400);
}
function handleAnswer(sel,btn){
  if(state.busy)return;state.busy=true;
  if(state.timerInterval)clearInterval(state.timerInterval);
  el.timer.classList.remove('active','warn');
  const ok=state.currentQ.ok,correct=sel===ok;
  document.querySelectorAll('.abtn').forEach(b=>{b.disabled=true;if(b.dataset.v===ok)b.classList.add('ok');});
  if(!correct)btn.classList.add('no');
  if(correct){SFX.correct();setTimeout(()=>performAttack(state.turn,1-state.turn),600);}
  else{
    SFX.wrong();redFlash();doShake(16,500);
    el.qPanel.classList.add('shake');setTimeout(()=>el.qPanel.classList.remove('shake'),550);
    setTimeout(()=>feedback('MELESET!','#f87171'),250);
    setTimeout(()=>rollCounterAttack(),1500);
  }
}
function rollCounterAttack(){
  const counter=Math.random()<0.5;
  if(counter){
    setTimeout(()=>{
      SFX.counter();feedback('COUNTER ATTACK!','#FF6B6B');
      setTimeout(()=>performAttack(1-state.turn,state.turn),700);
    },200);
  }else{
    setTimeout(()=>{feedback('TIDAK ADA SERANGAN BALIK','#94a3b8');setTimeout(()=>nextTurn(),900);},200);
  }
}
function performAttack(atk,def){
  const names=['SOEKARNO','BELANDA'],colors=['#FFD93D','#87CEEB'];
  feedback(names[atk]+' MENYERANG!',colors[atk]);
  if(atk===0)anim.soek.lunge=1;else anim.dutch.lunge=1;
  setTimeout(()=>{
    SFX.hit();
    state.hp[def]=Math.max(0,state.hp[def]-10);
    updateHP();
    if(def===0)anim.soek.flash=1;else anim.dutch.flash=1;
    floatDmg(def,'-10');doShake(8,250);
    if(atk===0)anim.soek.lunge=0;else anim.dutch.lunge=0;
    setTimeout(()=>{if(state.hp[def]<=0)endGame();else nextTurn();},950);
  },300);
}
function nextTurn(){state.turn=1-state.turn;state.currentQ=null;startTurn();}

function showKOOverlay(){
  const ko=document.createElement('div');
  ko.style.cssText='position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:35;pointer-events:none;';
  const txt=document.createElement('div');
  txt.textContent='K.O.!';
  txt.style.cssText='color:#FF2828;font-size:clamp(80px,16vw,220px);font-weight:bold;text-shadow:6px 6px 0 #000,-3px -3px 0 #FFD93D,12px 12px 0 rgba(0,0,0,.5);animation:koPop 1.6s ease-out forwards;letter-spacing:8px;font-family:"Press Start 2P",monospace;';
  ko.appendChild(txt);document.getElementById('ui').appendChild(ko);
  if(!document.getElementById('koStyle')){
    const s=document.createElement('style');s.id='koStyle';
    s.textContent='@keyframes koPop{0%{opacity:0;transform:scale(.1) rotate(-20deg)}15%{opacity:1;transform:scale(1.4) rotate(8deg)}30%{transform:scale(1) rotate(-4deg)}45%{transform:scale(1.15) rotate(2deg)}60%{transform:scale(1) rotate(0)}85%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1.6)}}';
    document.head.appendChild(s);
  }
  setTimeout(()=>ko.remove(),1600);
}

function endGame(){
  state.active=false;
  if(state.timerInterval)clearInterval(state.timerInterval);
  el.qPanel.classList.remove('on');el.timer.classList.remove('active','warn');
  el.turn.textContent='PERTARUNGAN SELESAI';
  el.turn.style.color='#fff';el.turn.style.borderColor='#fff';
  stopMusic();SFX.ko();doShake(28,900);
  redFlash();setTimeout(redFlash,200);setTimeout(redFlash,400);
  showKOOverlay();
  setTimeout(()=>{
    const p1Win=state.hp[0]>0&&state.hp[1]<=0;
    const winner=p1Win?'SOEKARNO-HATTA':'TENTARA BELANDA';
    const sub=p1Win?'Kemerdekaan Indonesia tetap terjaga!':'Pasukan Belanda berhasil menaklukkan...';
    el.winName.textContent=winner;el.winName.style.color=p1Win?'#4ade80':'#f87171';
    el.winSub.textContent=sub;
    if(p1Win)SFX.win();else SFX.lose();
    setTimeout(()=>el.over.classList.add('on'),500);
  },1800);
}

/* ============ RENDER ============ */
function drawChar(img,x,y,face,a,idle){
  const bobY=Math.sin(performance.now()/idle+a.bob)*3;
  const lunge=a.lungeC*55;
  let shakeX=0;
  if(a.flashC>0.05)shakeX=Math.sin(performance.now()/28)*a.flashC*10;
  let dx=x+(face==='right'?lunge:-lunge)+shakeX;
  const dy=y+bobY;
  ctx.save();ctx.globalAlpha=0.4;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(x+img.width/2+(face==='right'?lunge:-lunge)*0.5,GROUND_Y+4,img.width*0.42,9,0,0,Math.PI*2);
  ctx.fill();ctx.restore();
  ctx.drawImage(img,Math.round(dx),Math.round(dy));
  if(a.flashC>0.05){ctx.save();ctx.globalAlpha=a.flashC*0.55;ctx.fillStyle='#ff2828';ctx.fillRect(Math.round(dx),Math.round(dy),img.width,img.height);ctx.restore();}
}

let lastTime=performance.now();
let nextPlaneSpawn=2000;
function render(now){
  const dt=Math.min(now-lastTime,50);lastTime=now;
  let shx=0,shy=0;
  if(shakeTime>0){
    shakeTime-=dt;
    shx=(Math.random()-0.5)*shakeAmount*2;
    shy=(Math.random()-0.5)*shakeAmount*2;
    shakeAmount*=0.9;
  }
  ctx.save();ctx.translate(shx,shy);
  if(bgCache)ctx.drawImage(bgCache,0,0);

  // Spawn planes
  nextPlaneSpawn-=dt;
  if(nextPlaneSpawn<=0 && planes.length<4){
    nextPlaneSpawn=2500+Math.random()*2000;
    spawnPlanePair();
  }

  // Random mushroom explosions in background
  if(Math.random()<0.004){
    const ex=80+Math.random()*(W-160);
    const behind=Math.random()<0.6;
    spawnMushroom(ex,GROUND_Y-20-Math.random()*40,behind);
  }

  updatePlanes(dt);

  // Background explosions (behind buildings)
  for(const e of explosions)if(e.behind)drawMushroom(e);
  // Planes
  for(const p of planes)drawPlane(p);
  // Air bullets
  for(const b of airBullets)drawAirBullet(b);
  // Foreground explosions
  for(const e of explosions)if(!e.behind)drawMushroom(e);

  // Chars
  anim.soek.lungeC+=(anim.soek.lunge-anim.soek.lungeC)*0.18;
  anim.dutch.lungeC+=(anim.dutch.lunge-anim.dutch.lungeC)*0.18;
  anim.soek.flashC+=(anim.soek.flash-anim.soek.flashC)*0.22;
  anim.dutch.flashC+=(anim.dutch.flash-anim.dutch.flashC)*0.22;
  anim.soek.flash*=0.94;anim.dutch.flash*=0.94;
  drawChar(SOEK_IMG,SOEK_X,SOEK_Y,'right',anim.soek,340);
  drawChar(DUTCH_IMG,DUTCH_X,DUTCH_Y,'left',anim.dutch,380);

  // Turn arrow
  if(state.active){
    const ax=state.turn===0?SOEK_X+SOEK_W/2:DUTCH_X+DUTCH_W/2;
    const ay=(state.turn===0?SOEK_Y:DUTCH_Y)-22;
    const bnc=Math.sin(performance.now()/300)*5;
    ctx.save();ctx.fillStyle=state.turn===0?'#FFD93D':'#87CEEB';ctx.strokeStyle='#000';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(ax,ay+16+bnc);ctx.lineTo(ax-13,ay+bnc);ctx.lineTo(ax+13,ay+bnc);ctx.closePath();
    ctx.fill();ctx.stroke();ctx.restore();
  }
  ctx.restore();
  requestAnimationFrame(render);
}

/* ============ INIT ============ */
function init(){
  buildBackground();
  updateHP();
  document.getElementById('startBtn').addEventListener('click',()=>{SFX.click();startGame();});
  document.getElementById('againBtn').addEventListener('click',()=>{SFX.click();el.over.classList.remove('on');startGame();});
  el.muteBtn.addEventListener('click',()=>{
    sfxOn=!sfxOn;
    el.muteBtn.textContent=sfxOn?'SFX: ON':'SFX: OFF';
    el.muteBtn.classList.toggle('off',!sfxOn);
    if(!sfxOn)stopMusic();
    else if(state.active){initAudio();if(AC&&AC.state==='suspended')AC.resume();startMusic();}
  });
  requestAnimationFrame(render);
}
init();
</script>
